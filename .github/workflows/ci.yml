name: CI Lint & Test

on:
  push:
    branches: ["main"]
    paths:
      - "course4/**"

  pull_request:
    branches: ["main"]
    paths:
      - "course4/**"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]" 
          if [ -f course4/requirements.txt ]; then pip install -r course4/requirements.txt; fi

      - name: Pull DVC data for course4
        run: |
          dvc pull \
            course4/model/encoder.pkl.dvc \
            course4/model/label_binarizer.pkl.dvc \
            course4/model/model.pkl.dvc

      - name: Lint with flake8
        run: |
          flake8 course4 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 course4 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pytest course4
